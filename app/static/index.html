<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JD Analyser — AI Career Coach</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #ececec;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 16px 24px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        header span {
            font-size: 12px;
            color: #888;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .message.user {
            background: #2563eb;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background: #1e1e1e;
            color: #ececec;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #2a2a2a;
        }

        .message.thinking {
            background: #1e1e1e;
            color: #888;
            align-self: flex-start;
            border: 1px solid #2a2a2a;
            font-style: italic;
        }

        #input-area {
            padding: 16px 24px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        #user-input {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 12px 16px;
            color: #ececec;
            font-size: 14px;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            outline: none;
            font-family: inherit;
        }

        #user-input:focus {
            border-color: #2563eb;
        }

        #send-btn {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            height: 44px;
            transition: background 0.2s;
        }

        #send-btn:hover { background: #1d4ed8; }
        #send-btn:disabled { background: #333; cursor: not-allowed; }

        .tokens {
            font-size: 10px;
            color: #555;
            margin-top: 4px;
            text-align: right;
        }

        #session-info {
            font-size: 11px;
            color: #555;
            padding: 8px 24px;
            background: #0f0f0f;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <div class="status-dot"></div>
    <h1>JD Analyser</h1>
    <span>AI Career Coach — powered by LLaMA 3.3 70B</span>
</header>

<div id="session-info">Session: <span id="session-id"></span></div>

<div id="chat-container">
    <div class="message assistant">👋 Hi! I'm your AI Career Coach. Paste any job description and I'll analyse the required skills, assess your gaps, and build you a personalised learning roadmap.</div>
</div>

<div id="input-area">
    <textarea 
        id="user-input" 
        placeholder="Paste a job description or ask anything..." 
        rows="1"
    ></textarea>
    <button id="send-btn">Send</button>
</div>

<script>
    // Generate unique session ID
    const sessionId = 'session_' + Math.random().toString(36).substr(2, 9);
    document.getElementById('session-id').textContent = sessionId;

    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // Auto-resize textarea
    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = this.scrollHeight + 'px';
    });

    // Send on Enter (Shift+Enter for new line)
    userInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    sendBtn.addEventListener('click', sendMessage);

    function addMessage(role, content, tokens = null) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = content;
        
        if (tokens) {
            const tokenDiv = document.createElement('div');
            tokenDiv.className = 'tokens';
            tokenDiv.textContent = `${tokens} tokens`;
            div.appendChild(tokenDiv);
        }
        
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return div;
    }

    async function sendMessage() {
        const content = userInput.value.trim();
        if (!content) return;

        // Show user message
        addMessage('user', content);
        userInput.value = '';
        userInput.style.height = 'auto';
        sendBtn.disabled = true;

        // Show thinking indicator
        const thinking = addMessage('thinking', '⏳ Analysing...');

        try {
            const response = await fetch(`/api/v1/chat/${sessionId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [{ role: 'user', content }]
                })
            });

            const data = await response.json();
            thinking.remove();

            if (data.reply) {
                addMessage('assistant', data.reply, data.tokens_used);
            } else {
                addMessage('assistant', '❌ Error: ' + (data.detail || 'Something went wrong'));
            }

        } catch (error) {
            thinking.remove();
            addMessage('assistant', '❌ Connection error. Please try again.');
        }

        sendBtn.disabled = false;
        userInput.focus();
    }
</script>

</body>
</html>
